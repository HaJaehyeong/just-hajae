name: Next.js CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 패키지 설치
        run: npm ci

      - name: 🔍 ESLint
        run: npm run lint

      - name: 🧠 Type Check
        run: npm run typecheck

      - name: 🧪 Test
        run: npm run test

      - name: 🏗 Build
        run: npm run build
